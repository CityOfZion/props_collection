on:
  push:
    branches:
      - main

name: Build and deploy the props components to the production environment

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID_PROD}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY_PROD}}
          aws-region: us-west-1
      - name: Build SDK
        run: cd sdk-ts && npm install --force && NODE_ENV=production CI=false NODE_OPTIONS=--openssl-legacy-provider npm run build --verbose
      - name: Build App
        run: cd front-end && npm install --force && NODE_ENV=production CI=false NODE_OPTIONS=--openssl-legacy-provider npm run build --verbose
      - name: Deploy app build to S3 bucket
        run: aws s3 sync ./front-end/dist/ s3://marketing-coz/prod/products/props/apps/props_collection --delete
